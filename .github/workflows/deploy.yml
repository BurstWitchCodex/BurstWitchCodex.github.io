# 站点发布：仓库根就是站点根（index.html 在根目录）
# 只发布 index.html/css/js/data/docs/pages/media/favicon.png，不发布 tools/ 与 .git*
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 组装站点目录
        run: |
          mkdir -p _site
          cp index.html favicon.png README.md _site/
          cp -r css js data docs pages media _site/
          find _site -name '.git*' -o -name 'Thumbs.db' | xargs -r rm -f
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
